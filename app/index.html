<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <!-- Sécurité : seuls les scripts de l'appli elle-même peuvent s'exécuter (aucun code glissé dans la page ne peut tourner) -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co https://abacus.jasoncameron.dev; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <!-- L'appli n'apparaît jamais dans Google : seule la page d'accueil du site peut être trouvée -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PeakMind</title>
  <meta name="description" content="PeakMind : fixe ton objectif, suis tes progrès chaque jour et atteins ton sommet.">
  <meta name="theme-color" content="#0c1018">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PeakMind">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Fond : ciel aux couleurs du thème et chaîne de montagnes (fixe, sans animation) -->
  <div class="bg-scene" aria-hidden="true">
    <svg class="bg-range" viewBox="0 0 400 170" preserveAspectRatio="xMidYMax slice">
      <path class="bg-far" d="M0 170V100L36 80L66 94L110 58L146 86L196 38L236 76L274 60L316 88L358 68L400 84V170Z"/>
      <path class="bg-snow" d="M196 38L182 52L190 50L196 56L203 49L211 53Z"/>
      <path class="bg-ridge far" d="M0 100L36 80L66 94L110 58L146 86L196 38L236 76L274 60L316 88L358 68L400 84"/>
      <path class="bg-near" d="M0 170V126L42 108L86 122L132 92L168 110L214 80L252 104L296 94L340 116L400 100V170Z"/>
      <path class="bg-ridge near" d="M0 126L42 108L86 122L132 92L168 110L214 80L252 104L296 94L340 116L400 100"/>
      <g class="bg-flag"><line x1="196" y1="38" x2="196" y2="22"/><path d="M196.6 22L208 25.6L196.6 29.2Z"/></g>
    </svg>
    <div class="bg-floor"></div>
  </div>
  <div id="app">
    <header class="topbar">
      <img src="icons/icon-192.png" alt="" class="logo" width="36" height="36">
      <div class="brand"><span>PEAK</span><span class="hl">MIND</span></div>
      <button class="icon-btn" id="langBtn" type="button" aria-label="Langue / Language">FR</button>
      <button class="icon-btn" id="setBtn" type="button" aria-label="Réglages"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></button>
    </header>
    <main id="view" tabindex="-1"></main>
    <nav class="tabbar" aria-label="Navigation">
      <button type="button" data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20 10 9l4 6 2-3 4 8z"/></svg><span data-i18n="tab.today"></span></button>
      <button type="button" data-tab="goals"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/></svg><span data-i18n="tab.goals"></span></button>
      <button type="button" class="add" id="addBtn" aria-label="+"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      <button type="button" data-tab="league"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg><span data-i18n="tab.league"></span></button>
      <button type="button" data-tab="profile"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.2 3.6-7 8-7s8 2.8 8 7"/></svg><span data-i18n="tab.profile"></span></button>
    </nav>
  </div>
  <div id="welcome" class="welcome" role="dialog" aria-modal="true" aria-label="PeakMind" hidden></div>
  <div id="sheet" class="sheet" hidden></div>
  <div id="fxConfetti" class="confetti fx" aria-hidden="true"></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="config.js"></script>
  <script src="quests.js"></script>
  <script src="money.js"></script>
  <script src="app.js"></script>
</body>
</html>
